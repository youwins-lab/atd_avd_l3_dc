---
# DC2 DCI Core 스위치(s2-core1/2)는 eos_designs로 관리되지 않는 static config 장비라
# generate_cv_tags(eos_designs 전용 기능)가 적용되지 않는다. deploy_dc2_dci_cvp.yml이
# read_structured_config_from_file: false로 cv_deploy를 호출하므로, cv_deploy는 구조화된
# structured_config 대신 이 cv_device_tags 변수를 바로 읽어 CloudVision에 device tag로 올린다.
# AVD가 leaf/spine에 자동 생성하는 topology_hint_* 네이밍과 맞춰서 CVP Topology 뷰에서
# 동일한 체계로 인식되도록 한다.
cv_device_tags:
  - name: topology_hint_type
    value: core
  - name: topology_hint_network_type
    value: wan