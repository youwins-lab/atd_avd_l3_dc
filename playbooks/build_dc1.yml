---
- name: Build DC1 Switch Configurations
  hosts: dc1_fabric
  # 빌드는 로컬에서 structured config/설정 파일만 생성하므로 장비에 접속할 필요가 없다.
  # (fact 수집이 켜져 있으면 빌드할 때마다 스위치 16대에 eAPI로 로그인한다 → CI 러너에서는 실패)
  gather_facts: false
  tasks:

    - name: Import Global Vars
      include_vars: "{{ item }}"
      with_items:
        - "../global_vars/global_dc_vars.yml"

    - name: Generate Structured Variables per Device
      import_role:
        name: arista.avd.eos_designs

    - name: Generate Intended Config and Documentation
      import_role:
        name: arista.avd.eos_cli_config_gen